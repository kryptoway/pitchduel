name: Archive month
# Po kazdej zmianie pairs.json zapisuje kopie pairs-RRRR-MM.json (potrzebna backendowi do trofeow).
on:
  push:
    branches: [main]
    paths: ['pairs.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-month
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/archive_month.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pairs-*.json
          if ! git diff --cached --quiet; then
            git commit -qm "Archive pairs.json snapshot"
            git pull -q --rebase origin main
            git push -q origin main
          fi
