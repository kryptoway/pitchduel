name: Live data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Previous live.json
        run: |
          if git fetch -q origin live-data:refs/remotes/origin/live-data 2>/dev/null; then
            git show origin/live-data:live.json > prev.json || echo '{}' > prev.json
          else
            echo '{}' > prev.json
          fi
      - name: Update
        id: upd
        run: python3 tools/live.py prev.json live.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Publish to live-data branch
        if: steps.upd.outputs.changed == 'true'
        run: |
          mkdir /tmp/pub && cp live.json /tmp/pub/ && cd /tmp/pub
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json && git commit -qm "live data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" live-data
