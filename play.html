<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDF Battle – pick the better player</title>
<meta name="description" content="A free monthly prediction game: pick which player scores more in the next round and climb the leaderboard.">

<style>
:root{--bg:#0A1812;--card:#0f2118;--ink:#E7F0EA;--mut:#9FB2A6;--line:#2b4538;--acc:#4FB583;--gold:#F2C230;--red:#EE7A68;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:#0A1812}
body{margin:0;background:#0A1812 repeating-linear-gradient(90deg,#0c1e15 0 96px,#0a1812 96px 192px);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:20px 14px 40px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 28px;margin:0 0 16px}
.brand a{font:700 clamp(28px,7vw,40px)/1.05 "Barlow Condensed",Impact,sans-serif;letter-spacing:.5px;text-decoration:none;color:var(--mut);padding-bottom:3px;border-bottom:3px solid transparent}
.brand a:hover{color:var(--ink)}.brand a.on{color:var(--ink);border-bottom-color:var(--acc)}
.cn{font-family:"Barlow Condensed",Impact,sans-serif}
.hero{text-align:center;margin:26px 0 20px}
.eb{font-size:14px;letter-spacing:.2em;color:var(--gold);font-weight:600}
h1{margin:8px 0 10px;font:700 clamp(44px,8vw,80px)/.95 "Barlow Condensed",Impact,sans-serif}
.sub{margin:0 auto;max-width:560px;font-size:18px;color:#B8C8BE}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0}
.tab,.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:600}
.tab.on{background:var(--ink);color:#0A1812;border-color:var(--ink)}
.panel{max-width:460px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px}
.panel label{display:block;font-size:13px;letter-spacing:.12em;color:var(--mut);margin:14px 0 6px}
.panel input[type=text],.panel input[type=password]{width:100%;background:#0A1812;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px}
.btn{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--gold);color:#10251B;font-weight:700;font-size:18px}
.btn:disabled{opacity:.55;cursor:default}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0}.err{color:var(--red);font-weight:600;margin:12px 0 0}
.bar2{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 13px;font-size:14px}.chip.on{border-color:var(--gold);color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mut)}.dot.p{background:var(--acc);border-color:var(--acc)}.dot.l{background:#59685f;border-color:#59685f}
.duel{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:22px}
.cd{position:relative;flex:1 1 340px;max-width:460px;text-align:left;border-radius:26px;padding:26px 26px 24px;background:linear-gradient(160deg,#173320 0%,#0f2118 55%,#0c1a13 100%);border:1.5px solid var(--line);box-shadow:0 24px 48px -24px #000}
.cd:disabled{cursor:default}.cd.on{border-color:var(--gold);box-shadow:0 0 0 5px rgba(242,194,48,.16),0 34px 70px -24px rgba(242,194,48,.4)}
.cd.win{border-color:var(--acc)}.cd.dim{opacity:.72}
.rib{position:absolute;top:-14px;right:24px;padding:6px 14px;border-radius:999px;background:var(--gold);color:#10251B;font-size:13px;font-weight:700;letter-spacing:.12em}.rib.w{background:var(--acc)}
.r1{display:flex;align-items:center;justify-content:space-between}
.pos{padding:5px 12px;border-radius:8px;background:var(--acc);color:#0A1812;font-weight:700;font-size:13px;letter-spacing:.1em}
.clb{font:600 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;color:#B8C8BE}
.who{display:flex;align-items:center;gap:18px;margin:20px 0}
.mono{flex:0 0 auto;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#2d5a3f,#0f2118);border:3px solid var(--line);font:700 32px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em}
.cd.on .mono{border-color:var(--acc)}
.nm{font:700 clamp(36px,5vw,54px)/.95 "Barlow Condensed",sans-serif;overflow-wrap:anywhere}
.fx{display:flex;align-items:center;gap:16px;margin:0 0 16px;padding:12px 16px;border-radius:16px;background:rgba(10,24,18,.75);border:1px solid var(--line)}
.dt{flex:0 0 auto;width:54px;text-align:center;line-height:1;font-size:11px;letter-spacing:.14em;color:var(--mut)}.dt b{display:block;font:700 36px/1.05 "Barlow Condensed",sans-serif;color:var(--gold)}
.fx small{display:block;font-size:11px;letter-spacing:.14em;color:var(--mut)}.fx strong{display:block;font-size:18px;margin-top:2px}.fx span{font-size:13px;color:var(--mut)}.fx span b{color:var(--ink)}
.sts{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.st b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif}.st i{font-style:normal;font-size:12px;letter-spacing:.14em;color:var(--mut)}
.fm{margin-top:14px;font-size:12px;letter-spacing:.14em;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:8px}
.b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;flex:1;font-size:11px;color:var(--mut)}.b i{display:block;width:62%;border-radius:6px 6px 2px 2px}
.vs{flex:0 0 auto;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0A1812;border:3px solid var(--gold);font:700 27px/1 "Barlow Condensed",sans-serif;color:var(--gold);z-index:1}
.nav2{display:flex;justify-content:center;gap:12px;margin-top:26px}
.nav2 button{padding:10px 22px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:600}.nav2 button:disabled{opacity:.4;cursor:default}
.stat{text-align:center;margin-top:18px;min-height:28px;font-weight:600}.ok{color:var(--acc)}.gold{color:var(--gold)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;letter-spacing:.14em;color:var(--mut)}td.n,th.n{text-align:right}
tr.me td{background:rgba(242,194,48,.12);font-weight:600}
.txt{max-width:760px;margin:0 auto}.txt h2{font:700 28px/1.1 "Barlow Condensed",sans-serif;margin:26px 0 8px}.txt p,.txt li{color:#C9D6CE}
.ft{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin:40px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
a{color:var(--acc)}
.sum{max-width:760px;margin:0 auto}.sum h2{font-size:clamp(26px,4vw,34px);margin:0 0 4px;text-align:center}.sr{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:9px 12px;border:1px solid #2b4538;border-radius:10px;margin:6px 0;background:rgba(255,255,255,.03)}.sr .ps{font-size:12px;font-weight:700;color:var(--gold);min-width:34px}.sr .pk{font-size:15px;line-height:1.25}.sr .pk small{display:block;color:var(--mut);font-size:12px}.sr .rt{font-size:12px;color:var(--mut);text-align:right}.sr button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}.sr.no{opacity:.75}
@media(max-width:640px){.brand{flex-wrap:nowrap;gap:0 12px;margin:0 0 2px;white-space:nowrap}.brand a{font-size:16px;border-bottom-width:2px}
.hero h1,.hero .sub:not(.tn){display:none}.hero .eb{font-size:12px}.tn{font-size:13px!important;margin-top:6px!important;line-height:1.35;text-align:center}.tn .rib{display:table!important;margin:0 auto 5px;padding:3px 10px;font-size:11px}
.rh{display:none}.bar2{margin:0 0 8px;font-size:14px}.bar2 .chip{padding:2px 8px!important}.chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}.chips .chip{flex:0 0 auto}
main{padding:12px 10px 30px}.hero{margin:12px 0 10px}h1{font-size:40px;margin:4px 0 6px}.sub{font-size:15px}.tabs{margin:10px 0;gap:6px}.tab{padding:6px 11px;font-size:14px}.chips{margin:0 0 10px;gap:6px}.chip{padding:4px 10px}
.duel{flex-direction:column;flex-wrap:nowrap;gap:0}.cd{flex:0 0 auto;width:100%;max-width:none;padding:12px 14px 10px;border-radius:18px}.rib{top:-10px;right:14px;padding:3px 10px;font-size:11px}
.pos{padding:3px 9px;font-size:11px}.clb{font-size:17px}.who{margin:8px 0;gap:12px}.mono{width:46px;height:46px;font-size:18px;border-width:2px}.nm{font-size:30px}
.fx{margin:0 0 8px;padding:7px 10px;gap:10px;border-radius:12px}.dt{width:40px;font-size:9px}.dt b{font-size:24px}.fx strong{font-size:15px}.fx span{font-size:12px}
.sts{padding:6px 0}.st b{font-size:24px}.st i{font-size:10px}.fm,.bars{display:none}
.vs{width:40px;height:40px;font-size:17px;border-width:2px;margin:-12px 0}.nav2{margin-top:14px}.stat{margin-top:10px}}
@media(max-width:640px){.hero{margin:4px 0 4px}.tabs{margin:6px 0;gap:5px}.tab{padding:5px 9px;font-size:13px}.bar2{flex-wrap:nowrap;font-size:13px;gap:6px}.bar2 .chip{font-size:12px!important}.chips{margin:0 0 8px}.chip{padding:3px 9px;font-size:13px}
.cd{padding:9px 12px 8px}.who{margin:4px 0}.mono{width:38px;height:38px;font-size:15px}.nm{font-size:26px}.fx{margin:0 0 6px;padding:5px 9px}.fx small{font-size:9px}.fx strong{font-size:14px}.fx span{font-size:11px}.dt b{font-size:20px}.dt{width:34px}
.sts{padding:4px 0;border-bottom:0}.st b{font-size:20px;display:inline}.st i{font-size:9px;margin-left:5px}.vs{width:34px;height:34px;font-size:14px;margin:-10px 0}.stat{margin-top:6px;min-height:20px;font-size:14px}.nav2{margin-top:8px}.nav2 button{padding:7px 16px}}
@media(min-width:641px){.who{margin:6px 0 18px;gap:14px}.who{min-height:72px;gap:12px}.mono{width:58px;height:58px;font-size:22px}.nm{font-size:clamp(28px,2.9vw,36px);line-height:1}.nm .pos{white-space:nowrap;margin-left:8px}.clb{font-size:19px}.duel{align-items:stretch}.vs{align-self:center}.cd{display:flex;flex-direction:column}.cd .bars{margin-top:auto}}.nm{flex:1 1 auto;min-width:0}.nm .pos{display:inline-block;vertical-align:middle;margin-left:12px;line-height:1.3;position:relative;top:-2px}.clb{align-self:flex-start;margin-top:2px}
@media(max-width:640px){.nm .pos{margin-left:8px;top:-1px}.who{align-items:center}.clb{align-self:center;margin-top:0}}
.tn{text-align:center}.tn .rib{display:table!important;margin:0 auto 6px}.tn .tl{display:block}
</style><style>@media(max-width:640px){.brand{flex-wrap:nowrap;justify-content:space-between;gap:0 6px;white-space:nowrap;margin:0 0 8px}.brand a{font-size:min(4vw,24px);border-bottom-width:2px;padding-bottom:2px}}</style>
</head><body><main>
<nav class="brand" aria-label="Pages"><a href="./">SDF Dashboard</a><a href="about.html">About the Game</a><a class="on" href="play.html" aria-current="page">SDF Battle</a></nav>
<div id="app" aria-live="polite"><p class="sub" style="text-align:center">Loading…</p></div>
<noscript><p class="sub">SDF Battle needs JavaScript to run.</p></noscript>
<footer class="ft"><span>Free fan game. Unofficial, not affiliated with Sport.fun.</span><span>Created by <a href="https://x.com/kryptoway_ai" target="_blank" rel="noopener noreferrer">@kryptoway_ai</a></span></footer>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbyT3yIdS3C_5P_eoLDubkP7HbEWmvAHaoxb663VbunPZzI8z7Fqr4Mc5zj4_gjby_wK/exec',MONTH='2026-11';
const $=id=>document.getElementById(id);
const S={pairs:[],round:'',user:null,picks:{},view:'picks',cur:0,mode:'new',err:'',nickDraft:'',msg:'',board:null,busy:false,loaded:false,remember:true,failed:false};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>typeof v==='number';
const POSN={GK:'Goalkeepers',DEF:'Defenders',MID:'Midfielders',FWD:'Forwards'};
const COL={L:'#4FB583',C:'#F2C230',N:'#7FA2F0'};
const ERR={bad_nick:'Nickname: 3–16 characters, letters, numbers or _ only.',bad_pin:'PIN must be exactly 4 digits.',nick_taken:'That nickname is already taken.',bad_credentials:'Wrong nickname or PIN.',too_many_attempts:'Too many wrong PINs. Try again in 15 minutes.',locked:'This pair is already locked.',network:'Cannot reach the server. Check your connection and try again.',default:'Something went wrong. Please try again.'};
const typ=r=>{const m=/[NPCL]\s*$/i.exec(String(r));if(!m)return'L';const t=m[0].trim().toUpperCase();return t==='P'?'C':t};
const lab=r=>String(r).trim().replace(/[NPCL]$/i,'');
const locked=p=>Date.now()>=Date.parse(p.lock);
const done=p=>p.result==='A'||p.result==='B'||p.result==='void';
async function api(b){try{const r=await fetch(API,{method:'POST',body:JSON.stringify(b)});return await r.json()}catch(e){return{ok:false,error:'network'}}}
function stash(){try{if(S.remember&&S.user)localStorage.setItem('sdfbattle',JSON.stringify({n:S.user.nick,p:S.user.pin}));else localStorage.removeItem('sdfbattle')}catch(e){}}
function dateBlock(d){const t=new Date(d+'T12:00:00Z'),o={timeZone:'UTC'};return`<div class="dt">${t.toLocaleDateString('en-GB',{...o,weekday:'short'}).toUpperCase()}<b>${t.getUTCDate()}</b>${t.toLocaleDateString('en-GB',{...o,month:'short'}).toUpperCase()}</div>`}
function card(p,side){const x=p[side],m=x.match,pk=S.picks[p.id],on=pk===side.toUpperCase(),fin=done(p),win=p.result===side.toUpperCase(),vals=[...p.a.form,...p.b.form].map(f=>f.v).filter(num),mx=Math.max(...vals,1);
const off=!S.user||locked(p);
const bars=x.form.map(f=>{const t=typ(f.r),lb=lab(f.r);return num(f.v)?`<div class="b"><i style="height:${Math.max(3,Math.round(f.v/mx*60))}px;background:${COL[t]}"></i><span>${esc(lb)}</span><span>${Math.round(f.v)}</span></div>`:`<div class="b"><i style="height:3px;background:#EE7A68"></i><span>${esc(lb)}</span><span style="color:#EE7A68">${f.v==='DNP'?'DNP':'–'}</span></div>`}).join('');
const hs=p.score&&num(p.score[side]),pts=hs?p.score[side]+' PTS':'',yp='<span class="rib">YOUR PICK</span>';
const sc=fin?(win?`<span class="rib w">HIGHER SCORE${hs?' · '+pts:''}</span>`:hs?`<span class="rib" style="background:#2b4538;color:#E7F0EA">${pts}</span>`:on?yp:''):on?yp:'';
return`<button class="cd${on?' on':''}${fin&&win?' win':''}${fin&&!win&&p.result!=='void'?' dim':''}" data-act="pick" data-side="${side}" aria-pressed="${on}" aria-label="Pick ${esc(x.name)}"${off?' disabled':''}>${sc}
<div class="who"><div class="mono">${esc(x.name.replace(/[^A-Za-zÀ-ž]/g,'').slice(0,3).toUpperCase())}</div><div class="nm">${esc(x.name)}<span class="pos">${x.pos}</span></div><span class="clb">${esc(x.club)}</span></div>
<div class="fx">${dateBlock(m.date)}<div><small>NEXT MATCH</small><strong>${esc(m.venue==='H'?m.clubName+' v '+m.oppName:m.oppName+' v '+m.clubName)}</strong><span>${esc(m.comp||'')}${m.comp?' · ':''}${m.venue==='H'?'Home':'Away'} · <b>${esc(m.time)} CET</b></span></div></div>
<div class="sts"><div class="st"><b style="color:var(--gold)">${x.avg.toFixed(1)}</b><i>AVG</i></div><div class="st"><b>${x.played}</b><i>PLAYED</i></div><div class="st"><b>${x.max}</b><i>MAX</i></div></div>
<div class="fm">FORM · LAST 4 ROUNDS</div><div class="bars">${bars}</div></button>`}
function status(p){if(done(p)){const pk=S.picks[p.id];if(p.result==='void')return'<span class="gold">Void: no points for this pair</span>';return!pk?'<span style="color:var(--mut)">Scored. You did not pick this pair.</span>':pk===p.result?'<span class="ok">Correct: +1 point</span>':'<span style="color:var(--red)">Missed: 0 points</span>'}
if(locked(p))return`<span style="color:var(--mut)">Locked.${S.picks[p.id]?' Your pick is saved.':' You did not pick this pair.'}</span>`;
return`<span id="cd" data-lock="${p.lock}"></span>`}
function left(p){let s=Math.floor((Date.parse(p.lock)-Date.now())/1000);if(s<=0)return'Locking…';const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,z=n=>String(n).padStart(2,'0');return`Locks in ${d?d+'d ':''}${z(h)}:${z(m)}:${z(c)}`}
function loginPanel(){const n=S.mode==='new';return`<form class="panel" id="f" autocomplete="off"><div class="tabs" style="margin:0 0 6px"><button type="button" class="tab${n?' on':''}" data-act="mode" data-v="new">New nickname</button><button type="button" class="tab${n?'':' on'}" data-act="mode" data-v="login">I have one</button></div>
<label for="nick">NICKNAME</label><input id="nick" type="text" maxlength="16" autocapitalize="off" spellcheck="false" value="${esc(S.nickDraft)}" required>
<label for="pin">4-DIGIT PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>
<label style="display:flex;gap:8px;align-items:center;letter-spacing:0;font-size:14px;margin-top:14px"><input id="rem" type="checkbox"${S.remember?' checked':''}> Remember me on this device</label>
${S.err?`<p class="err">${esc(S.err)}</p>`:''}<button class="btn" type="submit"${S.busy?' disabled':''}>${S.busy?'One moment…':n?'Create nickname and play':'Log in'}</button>
<p class="hint">No email needed. Don’t reuse a PIN from anywhere important. A forgotten PIN can’t be recovered, so write it down.</p></form>`}
function opn(){return S.pairs.filter(q=>!locked(q)&&!done(q))}
function sumView(){const P=S.pairs,n=P.filter(q=>S.picks[q.id]).length,miss=P.filter(q=>!S.picks[q.id]&&!locked(q)).length;
const rows=P.map((q,i)=>{const s=S.picks[q.id],w=s?q[s.toLowerCase()]:null,o=s?q[s==='A'?'b':'a']:null,lk=locked(q)||done(q),m=w?w.match:q.a.match;
const when=new Date(q.lock).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Warsaw'});
let st;if(done(q)){st=q.result==='void'?'Void':!s?'–':s===q.result?'<span class="ok">+1</span>':'0'}else st=lk?'Locked':'Locks '+when;
return`<div class="sr${s?'':' no'}"><span class="ps">${q.pos}</span><div class="pk">${s?`<b>${esc(w.name)}</b> <small>over ${esc(o.name)}</small>`:`<span style="color:var(--mut)">No pick yet</span><small>${esc(q.a.name)} vs ${esc(q.b.name)}</small>`}</div><div class="rt">${lk?'':`<button data-act="edit" data-i="${i}">${s?'Change':'Pick'}</button><br>`}${st}</div></div>`}).join('');
return`<div class="bar2"><span>Playing as <b>${esc(S.user.nick)}</b> · <button class="chip" style="padding:3px 10px;font-size:13px" data-act="logout">Log out</button></span><span class="${n===P.length?'ok':''}"><b>${n}</b> of ${P.length} pairs picked</span></div>
<div class="sum"><h2>${miss?'Your picks so far':'All picks saved ✓'}</h2><p class="sub" style="text-align:center;margin:0 0 14px">${miss?miss+' pair'+(miss>1?'s':'')+' still open.':'You can change any pick until its pair locks.'}</p>${rows}<div class="nav2" style="margin-top:16px"><button data-act="back">Back to cards</button></div></div>`}
function picksView(){if(!S.user)return loginPanel();if(S.sum)return sumView();const P=S.pairs,p=P[S.cur];if(!p)return'<p class="sub" style="text-align:center">No pairs are open right now. Check back soon.</p>';
const n=Object.keys(S.picks).filter(k=>P.some(q=>q.id===k)).length;
const chips=P.map((q,i)=>{const c=done(q)||locked(q)?'l':S.picks[q.id]?'p':'';return`<button class="chip${i===S.cur?' on':''}" data-act="pair" data-i="${i}"><span class="dot ${c}"></span>${i+1}</button>`}).join('');
return`<div class="bar2"><span>Playing as <b>${esc(S.user.nick)}</b> · <button class="chip" style="padding:3px 10px;font-size:13px" data-act="logout">Log out</button></span><span class="${n===P.length?'ok':''}"><b>${n}</b> of ${P.length} pairs picked</span></div>
<div class="chips" role="group" aria-label="Pairs">${chips}</div>
<div class="rh" style="text-align:center;margin-bottom:22px"><div class="eb">ROUND ${esc(S.round)} · ${POSN[p.pos]||p.pos}</div><div class="cn" style="font-size:clamp(30px,5vw,44px);font-weight:700">Who scores more?</div></div>
<div class="duel">${card(p,'a')}<div class="vs">VS</div>${card(p,'b')}</div>
<div class="stat" role="status">${S.msg?`<span class="ok">${esc(S.msg)}</span>`:status(p)}</div>
<div class="nav2"><button data-act="prev"${S.cur===0?' disabled':''}>Previous pair</button><button data-act="next"${S.cur>=P.length-1?' disabled':''}>Next pair</button></div>
${P.some(q=>!locked(q)&&!done(q)&&!S.picks[q.id])?'':'<div style="text-align:center;margin-top:18px"><button class="btn" style="width:auto;padding:12px 34px" data-act="sum">My picks</button></div>'}`}
function boardView(){const b=S.board;let h='<div class="txt"><h2>Leaderboard · November</h2>';if(!b)return h+'<p>Loading…</p></div>';if(!b.ok)return h+`<p class="err">${esc(ERR[b.error]||ERR.default)}</p></div>`;
if(!b.board.length)return h+`<p>No scored pairs yet. The table fills in as soon as a round’s results are published on the SDF Dashboard.</p><p><button class="chip" data-act="refresh">Refresh</button></p></div>`;
return h+`<p class="hint" style="margin:0 0 12px">${b.scoredPairs} scored pairs so far. 1 point for every correct pick.</p><table><thead><tr><th>#</th><th>NICKNAME</th><th class="n">POINTS</th><th class="n">PICKS</th></tr></thead><tbody>${b.board.map((r,i)=>`<tr${S.user&&r.nick.toLowerCase()===S.user.nick.toLowerCase()?' class="me"':''}><td>${i+1}</td><td>${esc(r.nick)}</td><td class="n">${r.points}</td><td class="n">${r.answered}</td></tr>`).join('')}</tbody></table><p><button class="chip" data-act="refresh" style="margin-top:12px">Refresh</button></p></div>`}
function rulesView(){return`<div class="txt"><h2>How to play</h2><ul><li>Every round there are pairs of players, at least one per position (GK, DEF, MID, FWD).</li><li>Pick the player you think will score <b>more fantasy points</b> in his next match. Points are the ones shown on the SDF Dashboard.</li><li>You can change a pick until the pair locks. A pair locks at the <b>earlier kick-off</b> of the two players’ matches. The server checks the time, not your device.</li><li>1 point for every correct pick. If both players score the same or one of them does not play (DNP), the pair is void and nobody gets a point.</li><li>Points add up for the whole month, then a new month and a new league start. The leaderboard updates after the results of a round are published.</li></ul>
<h2>Prizes</h2><p>SDF Battle is a free fan game: no entry fee, no purchase, no betting and no money involved. In the November test month there are no material prizes. The top players get a place in the Hall of Fame and a shout-out on X.</p>
<h2>Privacy</h2><p>We store only your nickname, a scrambled (hashed) version of your PIN and your picks, in a Google Sheet owned by the site creator. No email, no advertising cookies. Your nickname and score are shown publicly on the leaderboard. Page views are counted anonymously. To delete your data, message <a href="https://x.com/kryptoway_ai" target="_blank" rel="noopener noreferrer">@kryptoway_ai</a> on X.</p>
<h2>Fair play</h2><p>One account per person. Offensive nicknames and attempts to cheat can lead to removal. Fixture times come from public schedules and may change. This is an unofficial fan project, not affiliated with Sport.fun or any club. Curious about the real game? <a href="about.html">Read the About page</a>.</p></div>`}
function draw(){const t=[['picks','Picks'],['mine','My picks'],['board','Leaderboard'],['rules','Rules']],cur=S.view==='picks'?(S.sum?'mine':'picks'):S.view;
$('app').innerHTML=`<div class="hero"><div class="eb">NOVEMBER LEAGUE</div><h1>WHO SCORES MORE?</h1><p class="sub">Pick the better player in each battle. Every correct pick is worth 1 point.</p><p class="sub tn" style="margin-top:10px"><span class="rib" style="position:static;display:inline-block">TEST ROUND</span> <span class="tl">This is the first test game of November.</span><span class="tl"> The league runs all month.</span></p></div>
<div class="tabs" role="tablist">${t.map(([k,l])=>`<button class="tab${cur===k?' on':''}" role="tab" aria-selected="${cur===k}" data-act="view" data-v="${k}">${l}</button>`).join('')}</div>
${S.failed?'<p class="err" style="text-align:center">Could not load the pairs. Please refresh the page.</p>':S.view==='picks'?(S.loaded?picksView():'<p class="sub" style="text-align:center">Loading…</p>'):S.view==='board'?boardView():rulesView()}`;tick()}
function tick(){const e=$('cd');if(e){const p=S.pairs[S.cur];e.textContent=p?left(p):''}}
setInterval(()=>{tick();const p=S.pairs[S.cur];if(S.view==='picks'&&p&&$('cd')&&locked(p))draw()},1000);
async function loadPicks(){const r=await api({action:'mypicks',nick:S.user.nick,pin:S.user.pin});if(r.ok){S.picks={};r.picks.forEach(x=>S.picks[x.pair]=x.choice)}return r}
async function submit(e){e.preventDefault();const nick=$('nick').value.trim(),pin=$('pin').value.trim();S.remember=$('rem').checked;S.nickDraft=nick;S.busy=true;S.err='';draw();
let r=await api({action:S.mode==='new'?'register':'login',nick,pin});
if(r.ok){S.user={nick:r.nick,pin};r=await loadPicks()}
S.busy=false;if(!r.ok){S.user=null;S.err=ERR[r.error]||ERR.default}else{stash();S.cur=Math.max(0,S.pairs.findIndex(q=>!locked(q)&&!S.picks[q.id]))}draw()}
async function pick(side){side=side.toUpperCase();const p=S.pairs[S.cur];if(!S.user||locked(p))return;const prev=S.picks[p.id];S.picks[p.id]=side;S.msg='Saving…';draw();
const r=await api({action:'pick',nick:S.user.nick,pin:S.user.pin,pair:p.id,choice:side});
if(r.ok){S.msg='Pick saved';draw();setTimeout(()=>{S.msg='';const i=S.pairs.findIndex((q,k)=>k>S.cur&&!locked(q)&&!S.picks[q.id]);if(i>=0)S.cur=i;else if(!S.pairs.some(q=>!locked(q)&&!done(q)&&!S.picks[q.id]))S.sum=true;draw()},700)}
else{if(prev)S.picks[p.id]=prev;else delete S.picks[p.id];S.msg='';if(r.error==='bad_credentials'){S.user=null;stash()}S.err=ERR[r.error]||ERR.default;if(S.user){S.msg=S.err;S.err=''}draw()}}
async function loadBoard(){S.board=null;draw();S.board=await api({action:'board',month:MONTH});draw()}
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='f')submit(e)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='view'){const v=b.dataset.v;S.msg='';if(v==='mine'){S.view='picks';S.sum=true;draw()}else{S.view=v;if(v==='picks')S.sum=false;if(v==='board')loadBoard();else draw()}}
else if(a==='mode'){S.mode=b.dataset.v;S.err='';draw()}
else if(a==='pair'){S.cur=+b.dataset.i;S.msg='';S.sum=false;draw()}
else if(a==='edit'){S.cur=+b.dataset.i;S.msg='';S.sum=false;draw();scrollTo(0,0)}
else if(a==='sum'){S.sum=true;draw()}
else if(a==='back'){S.sum=false;draw()}
else if(a==='prev'){S.cur=Math.max(0,S.cur-1);S.msg='';draw()}
else if(a==='next'){S.cur=Math.min(S.pairs.length-1,S.cur+1);S.msg='';draw()}
else if(a==='pick')pick(b.dataset.side)
else if(a==='logout'){S.sum=false;S.user=null;S.picks={};S.remember=false;stash();S.remember=true;draw()}
else if(a==='refresh')loadBoard()});
(async function init(){try{const r=await fetch('pairs.json?'+Date.now());const d=await r.json();S.pairs=d.pairs||[];S.round=d.round||'';S.loaded=true}catch(e){S.failed=true}
let sv=null;try{sv=JSON.parse(localStorage.getItem('sdfbattle')||'null')}catch(e){}
draw();if(sv&&sv.n&&sv.p&&S.loaded){const r=await api({action:'login',nick:sv.n,pin:sv.p});if(r.ok){S.user={nick:r.nick,pin:sv.p};await loadPicks();S.cur=Math.max(0,S.pairs.findIndex(q=>!locked(q)&&!S.picks[q.id]));draw()}}})();
</script></body></html>
